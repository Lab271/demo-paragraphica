[project]
name = "paragraphica"
version = "0.9.0"
description = "Terra Virtualis — the LAB271 remake of Paragraphica"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2",
    "requests>=2.32",
    "timezonefinder>=6",
    "typer>=0.12",
]

[project.scripts]
terra = "paragraphica.cli:app"

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = [
    "httpx2",  # starlette TestClient (httpx 0.x is deprecated there)
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paragraphica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette 1.6 still uses the anyio.abc.BlockingPortal alias; not ours to fix.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
# examples/rotary_probe.py is a Pi GPIO script (gpiozero) kept for #10.
extend-exclude = ["examples"]

[tool.ruff.lint]
# E701 - multiple-statements-on-one-line-colon
# E702 - multiple-statements-on-one-line-semicolon
ignore = ["E701", "E702"]
