[project]
name = "paragraphica"
version = "0.2.0"
description = "Terra Virtualis — the LAB271 remake of Paragraphica"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "openai>=3,<4",
    "requests>=2.32",
    "timezonefinder>=6",
    "typer>=0.12",
]

[project.scripts]
terra = "paragraphica.cli:app"

[project.optional-dependencies]
# Legacy Streamlit UI (terra_virtualis.py); removed in #10.
streamlit = ["streamlit>=1.30"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paragraphica"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# examples/rotary_probe.py is a Pi GPIO script (gpiozero) kept for #10; setup.py goes in #6.
extend-exclude = ["examples", "setup.py"]

[tool.ruff.lint]
# E701 - multiple-statements-on-one-line-colon
# E702 - multiple-statements-on-one-line-semicolon
ignore = ["E701", "E702"]
